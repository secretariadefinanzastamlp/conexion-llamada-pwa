<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexión de Llamada</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --primary-color: #34c759;
      --danger-color: #ff3b30;
      --text-color: #000000;
      --subtext-color: #8e8e93;
      --accent-blue: #007aff;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .contenedor {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .encabezado { text-align: center; margin-bottom: 20px; }
    .estado {
      font-size: 13px;
      color: var(--subtext-color);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }
    .icono { font-size: 48px; margin: 10px 0; }
    .titulo { font-size: 20px; font-weight: 700; margin: 4px 0; }
    .detalle { font-size: 14px; color: var(--subtext-color); }

    .dispositivos-lista {
      margin: 15px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dispositivo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border: 1.5px solid #e5e5ea;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dispositivo.seleccionado {
      border-color: var(--accent-blue);
      background-color: #f0f7ff;
    }

    .dispositivo-info {
      display: flex;
      flex-direction: column;
    }

    .dispositivo-nombre { font-weight: 600; font-size: 15px; }
    .dispositivo-estado { font-size: 12px; color: var(--subtext-color); }

    .campo-numero { margin: 15px 0; }
    .campo-numero label {
      display: block;
      font-size: 12px;
      color: var(--subtext-color);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .input-wrapper { display: flex; gap: 8px; }
    .campo-numero input {
      flex: 1;
      padding: 12px 16px;
      font-size: 22px;
      font-weight: bold;
      border: 1.5px solid #d1d1d6;
      border-radius: 12px;
      outline: none;
      letter-spacing: 1px;
      text-align: center;
      background-color: #fafafa;
    }
    .btn-borrar {
      padding: 0 16px;
      background-color: #e5e5ea;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      cursor: pointer;
    }

    .teclado-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .tecla {
      background-color: #f2f2f7;
      border: none;
      border-radius: 16px;
      padding: 14px 0;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .tecla:active { background-color: #d1d1d6; }
    .tecla .subtexto {
      font-size: 9px;
      color: var(--subtext-color);
      font-weight: 500;
      margin-top: 2px;
    }

    .acciones {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-conectar { background-color: var(--primary-color); color: white; }
    .btn-cancelar { background-color: #e5e5ea; color: var(--text-color); }

    .historial-seccion {
      border-top: 1px solid #e5e5ea;
      padding-top: 16px;
    }

    .historial-seccion h3 {
      font-size: 15px;
      margin: 0 0 12px 0;
      font-weight: 600;
    }

    .lista-historial {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 140px;
      overflow-y: auto;
    }

    .historial-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #f2f2f7;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-limpiar {
      margin-top: 12px;
      background: none;
      border: none;
      color: var(--danger-color);
      font-size: 12px;
      cursor: pointer;
      padding: 0;
      font-weight: 600;
    }
  </style>
</head>
<body>
<div class="contenedor" id="ventana">
  <div class="encabezado">
    <div class="estado" id="estado">Esperando...</div>
    <div class="icono" id="icono">📞</div>
    <div class="titulo" id="titulo">Listo para conectar</div>
    <div class="detalle" id="detalle">Selecciona un dispositivo y contesta</div>
  </div>

  <div class="dispositivos-lista">
    <div class="dispositivo seleccionado" onclick="seleccionar(this)">
      <div class="dispositivo-info">
        <span class="dispositivo-nombre">iPhone Principal</span>
        <span class="dispositivo-estado">Disponible • Bluetooth</span>
      </div>
      <span>📲</span>
    </div>
    <div class="dispositivo" onclick="seleccionar(this)">
      <div class="dispositivo-info">
        <span class="dispositivo-nombre">Celular Secundario</span>
        <span class="dispositivo-estado">Disponible • Red Wi‑Fi</span>
      </div>
      <span>📶</span>
    </div>
    <div class="dispositivo" onclick="seleccionar(this)" style="opacity: 0.6;">
      <div class="dispositivo-info">
        <span class="dispositivo-nombre">Otro Dispositivo</span>
        <span class="dispositivo-estado">Fuera de alcance</span>
      </div>
      <span>❌</span>
    </div>
  </div>

  <div class="campo-numero">
    <label for="numeroTel">Número a llamar:</label>
    <div class="input-wrapper">
      <input type="tel" id="numeroTel" placeholder="+1234567890" value="+1234567890">
      <button class="btn-borrar" onclick="borrarDigito()" title="Borrar">⌫</button>
    </div>
  </div>

  <div class="teclado-grid">
    <button class="tecla" onclick="agregarDigito('1')">1<span class="subtexto">&nbsp;</span></button>
    <button class="tecla" onclick="agregarDigito('2')">2<span class="subtexto">ABC</span></button>
    <button class="tecla" onclick="agregarDigito('3')">3<span class="subtexto">DEF</span></button>
    <button class="tecla" onclick="agregarDigito('4')">4<span class="subtexto">GHI</span></button>
    <button class="tecla" onclick="agregarDigito('5')">5<span class="subtexto">JKL</span></button>
    <button class="tecla" onclick="agregarDigito('6')">6<span class="subtexto">MNO</span></button>
    <button class="tecla" onclick="agregarDigito('7')">7<span class="subtexto">PQRS</span></button>
    <button class="tecla" onclick="agregarDigito('8')">8<span class="subtexto">TUV</span></button>
    <button class="tecla" onclick="agregarDigito('9')">9<span class="subtexto">WXYZ</span></button>
    <button class="tecla" onclick="agregarDigito('*')">*<span class="subtexto">&nbsp;</span></button>
    <button class="tecla" onclick="agregarDigito('0')" oncontextmenu="agregarDigito('+'); return false;">0<span class="subtexto">+</span></button>
    <button class="tecla" onclick="agregarDigito('#')">#<span class="subtexto">&nbsp;</span></button>
  </div>

  <div class="acciones">
    <button class="btn btn-cancelar" onclick="cancelar()">Cancelar</button>
    <button class="btn btn-conectar" id="btnConectar" onclick="conectar()">Conectar</button>
  </div>

  <div class="historial-seccion">
    <h3>Historial de llamadas</h3>
    <ul class="lista-historial" id="listaHistorial"></ul>
    <button class="btn-limpiar" onclick="limpiarHistorial()">Borrar historial</button>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW:', err));
    });
  }

  const estado = document.getElementById('estado');
  const icono = document.getElementById('icono');
  const titulo = document.getElementById('titulo');
  const detalle = document.getElementById('detalle');
  const btnConectar = document.getElementById('btnConectar');

  function seleccionar(el) {
    document.querySelectorAll('.dispositivo').forEach(d => d.classList.remove('seleccionado'));
    el.classList.add('seleccionado');
  }

  function vibrar() {
    if ('vibrate' in navigator) {
      navigator.vibrate(30);
    }
  }

  function agregarDigito(digito) {
    vibrar();
    const input = document.getElementById('numeroTel');
    if (input) input.value += digito;
  }

  function borrarDigito() {
    vibrar();
    const input = document.getElementById('numeroTel');
    if (input && input.value.length > 0) {
      input.value = input.value.slice(0, -1);
    }
  }

  function conectar() {
    const numeroInput = document.getElementById('numeroTel');
    const numero = numeroInput ? numeroInput.value.trim() : '';

    if (!numero) {
      alert('Ingresa un número telefónico válido.');
      return;
    }

    estado.textContent = 'Conectando...';
    icono.textContent = '⏳';
    titulo.textContent = 'Estableciendo conexión';
    detalle.textContent = 'Por favor, espera un momento';

    btnConectar.textContent = 'Conectando...';
    btnConectar.disabled = true;

    guardarEnHistorial(numero);

    setTimeout(() => {
      estado.textContent = 'Conectado ✓';
      icono.textContent = '✅';
      titulo.textContent = 'Llamada activa';
      detalle.textContent = 'Conexión establecida correctamente';
      btnConectar.textContent = 'Conectado';

      setTimeout(() => {
        window.location.href = `tel:${numero}`;
      }, 500);
    }, 2000);
  }

  function reLlamar(numero) {
    const input = document.getElementById('numeroTel');
    if (input) input.value = numero;
    conectar();
  }

  function cancelar() {
    if (confirm('¿Deseas cancelar la operación?')) {
      estado.textContent = 'Esperando...';
      icono.textContent = '📞';
      titulo.textContent = 'Listo para conectar';
      detalle.textContent = 'Selecciona un dispositivo y contesta';
      btnConectar.textContent = 'Conectar';
      btnConectar.disabled = false;
    }
  }

  function guardarEnHistorial(numero) {
    const llamadas = JSON.parse(localStorage.getItem('historial_android')) || [];
    const nuevaLlamada = {
      numero: numero,
      fecha: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    };

    llamadas.unshift(nuevaLlamada);
    localStorage.setItem('historial_android', JSON.stringify(llamadas));
    renderizarHistorial();
  }

  function renderizarHistorial() {
    const lista = document.getElementById('listaHistorial');
    if (!lista) return;

    const llamadas = JSON.parse(localStorage.getItem('historial_android')) || [];
    lista.innerHTML = '';

    if (llamadas.length === 0) {
      lista.innerHTML = '<li style="font-size:12px; color:#8e8e93; padding:5px 0;">Sin llamadas recientes</li>';
      return;
    }

    llamadas.forEach(item => {
      const li = document.createElement('li');
      li.className = 'historial-item';
      li.onclick = () => reLlamar(item.numero);

      li.innerHTML = `
        <span>📞 <strong>${item.numero}</strong> — <small style="color:#8e8e93;">${item.fecha}</small></span>
        <span title="Volver a llamar">📲</span>
      `;
      lista.appendChild(li);
    });
  }

  function limpiarHistorial() {
    localStorage.removeItem('historial_android');
    renderizarHistorial();
  }

  document.addEventListener('DOMContentLoaded', renderizarHistorial);
</script>
</body>
</html>
